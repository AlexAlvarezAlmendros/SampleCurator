# Publicar una versión.
#
#   git tag -a v0.3.0 -m "SampleCurator 0.3.0" && git push origin v0.3.0
#
# y este workflow hace el resto: compila para Linux y Windows, FIRMA los paquetes con la clave
# del actualizador, publica la release con todo dentro y añade el `latest.json` que la app
# consulta para saber que hay algo nuevo. Sin ese fichero firmado, nadie se entera de nada.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (p. ej. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  publicar:
    name: Paquetes · ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nombre: Linux (.deb y AppImage)
          - os: windows-latest
            nombre: Windows (.msi y .exe)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias de sistema (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential curl file pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La privada vive solo aquí, en los secretos del repositorio. La pública va compilada
          # dentro de la app: sin firma que case, el actualizador rechaza el paquete.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SampleCurator __VERSION__
          releaseDraft: false
          prerelease: false
          # El `latest.json` que consulta la app. Cada plataforma añade lo suyo al mismo fichero.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  sumas:
    name: Sumas de comprobación
    needs: publicar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Calcular y subir SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir sumas && cd sumas
          gh release download "$TAG" -p '*.deb' -p '*.AppImage' -p '*.msi' -p '*.exe'
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
