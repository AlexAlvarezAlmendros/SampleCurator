name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzar el empaquetado a mano sobre cualquier rama: así se puede comprobar que
  # los paquetes de Windows salen ANTES de fusionar, en vez de descubrirlo después.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tipos, lint y tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm typecheck
      - run: pnpm vitest run

  backend:
    # El núcleo se prueba en los DOS sistemas a propósito: la mitad del código toca rutas,
    # renombrados y prioridades de hilo, que es justo donde Linux y Windows se separan.
    name: Núcleo Rust · ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nombre: Linux
          - os: windows-latest
            nombre: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential curl file pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formato
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy sin avisos
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # El contrato generado se comprueba una sola vez: es el mismo archivo en los dos sistemas
      # y en Windows los finales de línea añadirían ruido al diff.
      - name: El contrato IPC generado está al día
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib export
          git diff --exit-code src/bindings.ts \
            || (echo "::error::src/bindings.ts no coincide con los tipos de Rust; regenéralo y commitéalo" && exit 1)

  bundle:
    name: Paquetes · ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    needs: [frontend, backend]
    # En los PR no se empaqueta (son ~15 minutos de runner por vuelta); sí al fusionar a main
    # y siempre que se pida a mano.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nombre: Linux (.deb y AppImage)
            artefacto: samplecurator-linux
            rutas: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            nombre: Windows (.msi y .exe)
            artefacto: samplecurator-windows
            rutas: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias de sistema (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential curl file pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.rutas }}
          if-no-files-found: error
